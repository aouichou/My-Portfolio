# render.yaml
services:
  - type: web
    name: portfolio-terminal
    env: docker
    dockerfilePath: ./portfolio-terminal/Dockerfile
    dockerContext: ./portfolio-terminal
    region: frankfurt
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      # Secret shared with the Django API; set via dashboard/CLI only,
      # never committed. sync: false keeps blueprint sync from managing it.
      - key: TERMINAL_PROXY_SECRET
        sync: false
      # F4-02 slug-bound guest tokens: must equal the Django API's
      # SECRET_KEY (the mint signs with it). Same rule as above —
      # dashboard/CLI-set only, sync: false keeps blueprint sync away.
      - key: TERMINAL_JWT_SECRET
        sync: false