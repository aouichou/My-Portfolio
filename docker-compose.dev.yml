# Local Development Docker Compose Configuration
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database (local) — must stay 17.x: the frozen Neon dump
  # (backups/neon-pre-rework-20261002.dump, PG 17) is restored into this
  # container by scripts/rehearse_dump_restore.sh, which enforces the version.
  db:
    image: postgres:17-alpine
    container_name: portfolio-db-dev
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_change_me
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (for terminal sessions and caching)
  redis:
    image: redis:7-alpine
    container_name: portfolio-redis-dev
    ports:
      - "6379:6379"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend API (Django)
  backend:
    build:
      context: ./portfolio_api
      dockerfile: Dockerfile.dev
    container_name: portfolio-backend-dev
    # Django 6 runserver has no ASGI mode (Channels' runserver override was
    # removed upstream) — serve daphne directly, matching prod exactly.
    command: daphne -b 0.0.0.0 -p 8000 portfolio_api.asgi:application
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=portfolio_api.settings
      - DATABASE_URL=postgresql://postgres:dev_password_change_me@db:5432/portfolio_dev
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0,localhost:8000,127.0.0.1:8000
      # F3-14: :3100 = the v2 dev server (npm run dev in portfolio_ui_v2 —
      # not compose-managed). Both UI generations can mint terminal tokens.
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100
      - TERMINAL_SERVICE_URL=ws://terminal:8000
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./portfolio_api:/app
      - ./portfolio_api/media:/app/media
      - backend_static:/app/staticfiles
    networks:
      - dev-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  # Frontend UI (Next.js)
  frontend:
    build:
      context: ./portfolio_ui
      dockerfile: Dockerfile.dev
    container_name: portfolio-frontend-dev
    command: npm run dev
    # Run as the host user's uid:gid — the whole portfolio_ui/ tree is
    # bind-mounted, and the image default (uid 999 'app') cannot write
    # package-lock.json / .next / new files owned by uid 1000 on the host
    # (EACCES on npm/next TypeScript auto-install). Frontend volumes must be
    # re-initialized once after this change (they cached uid-999 content).
    user: "1000:1000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_TERMINAL_WS_URL=ws://localhost:8001
      - NEXT_PUBLIC_MEDIA_URL=http://localhost:8000/media
      - SERVER_API_URL=http://backend:8000/api
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reload (excludes node_modules and build artifacts)
      - ./portfolio_ui:/app
      # Use named volumes to persist dependencies and build cache
      # These prevent host node_modules from overwriting container's packages
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    networks:
      - dev-network
    depends_on:
      - backend
    stdin_open: true
    tty: true

  # Terminal Service (FastAPI)
  terminal:
    build:
      context: ./portfolio-terminal
      dockerfile: Dockerfile.dev
    container_name: portfolio-terminal-dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DEBUG=True
      - REDIS_URL=redis://redis:6379/1
      - S3_BUCKET_URL=http://backend:8000/media
      # F4-01: DB-driven demo whitelist — the terminal service syncs
      # has_demo slugs from this API base (contract §6 feed).
      - API_BASE_URL=http://backend:8000
      # F4-02: slug-bound guest tokens — the terminal service verifies the
      # token Django forwards. Must equal the backend's SECRET_KEY (shared
      # secret; the literal here is the dev-compose key, not a real secret).
      - TERMINAL_JWT_SECRET=dev-secret-key-change-in-production
      # F3-14: allow the v2 dev-server origin (:3100) to open the hero WS.
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100
      # F4-03: kernel rlimits per session tree (defaults shown; unset = same
      # values). 0 disables a dimension (valgrind demos want a big
      # TERMINAL_RLIMIT_AS — 0 is fine there). CPU = CPU-seconds, not wall.
      # NPROC defaults to 0 (off): it is accounted per-UID across the whole
      # HOST kernel — finite values break innocent forks on shared-uid
      # hosts like this Docker Desktop VM. Set it only on dedicated-uid
      # hosts (D9 DO-droplet target).
      # - TERMINAL_RLIMIT_CPU=120            # RLIMIT_CPU seconds
      # - TERMINAL_RLIMIT_AS=536870912       # RLIMIT_AS bytes (512 MiB)
      # - TERMINAL_RLIMIT_NPROC=0            # off (see note above)
      # - TERMINAL_RLIMIT_FSIZE=20971520     # RLIMIT_FSIZE bytes (20 MiB)
      # F4-03 scratch/projects roots (defaults shown; tests pin these under
      # temp dirs via the same env vars):
      # - TERMINAL_SESSION_SCRATCH_ROOT=/tmp/terminal-sessions
      # - TERMINAL_PROJECTS_DIR=/home/coder/projects
    ports:
      - "8001:8000"
    volumes:
      - ./portfolio-terminal:/app
      - terminal_projects:/home/coder/projects
      - ./portfolio_api/media:/backend-media:ro
    networks:
      - dev-network
    depends_on:
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Nginx (optional - for testing production-like routing)
  # Uncomment if you want to test with nginx locally
  # nginx:
  #   image: nginx:alpine
  #   container_name: portfolio-nginx-dev
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
  #     - backend_static:/var/www/static:ro
  #     - ./portfolio_api/media:/var/www/media:ro
  #   networks:
  #     - dev-network
  #   depends_on:
  #     - frontend
  #     - backend

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
  backend_static:
    driver: local
  terminal_projects:
    driver: local
  # Frontend volumes for dependency isolation
  frontend_node_modules:
    driver: local
  frontend_next_cache:
    driver: local
