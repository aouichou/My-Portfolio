---
engines:
  CSSLint:
    enabled: true
    exclude_paths:
      # Exclude globals.css due to Tailwind-specific syntax
      - "portfolio_ui/src/app/globals.css"
  
  JSHint:
    enabled: true
    esversion: 6
    
  Prospector:
    enabled: true
    exclude_patterns:
      # Exclude Django migrations from style checks
      - "**/migrations/*.py"
  
  # Explicitly disable tools causing false positives in isolated directory scans
  Hadolint:
    enabled: false
  
  Jacksonlinter:
    enabled: false
  
  Markdownlint:
    enabled: false
  
  Pylint:
    enabled: false
  
  Pylintpython3:
    enabled: false
  
  Remark-lint:
    enabled: false
  
  Shellcheck:
    enabled: false
  
  Stylelint:
    enabled: false
  
  Tslint:
    enabled: false

  # Disable engines that are noisy/non-applicable in this repository setup
  Trivy:
    enabled: false

  ESLint:
    enabled: false

  "eslint-8":
    enabled: false

exclude_paths:
  - "portfolio_ui/package-lock.json"
  - "**/node_modules/**"
  - "**/*.min.js"
  - "**/*.min.css"
