# ./docker-compose.yml

services:
  frontend:
    build: 
      context: ./portfolio_ui
    environment:
      - NEXT_PUBLIC_API_URL=https://aouichou.me/api
      - NEXT_PUBLIC_MEDIA_URL=https://media.aouichou.me
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - app-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - media_volume:/app/media
    depends_on: [backend]
    restart: unless-stopped

  backend:
    build: 
      context: ./portfolio_api
    expose:
      - "8080"
    volumes:
      - ./portfolio_api/media:/app/media
    env_file: portfolio_api/.env
    environment:
      - DJANGO_SETTINGS_MODULE=portfolio_api.settings
      # Shared secret for the Django -> terminal WS hop (set in root .env or
      # shell; unset = consumer refuses to dial outside DEBUG)
      - TERMINAL_PROXY_SECRET=${TERMINAL_PROXY_SECRET:-}
    networks:
      - app-network
    restart: unless-stopped

  reverse-proxy:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - media_volume:/app/media:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on: [frontend, backend]

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - app-network

  terminal:
    build: 
      context: ./portfolio-terminal
    security_opt:
      # Root seccomp-profile.json (identical copy of portfolio-terminal/'s) is
      # intentionally KEPT until Phase 4 (F4-07 owns seccomp: default-DENY
      # conversion + consolidation to the single portfolio-terminal/ copy).
      # The path is relative to the compose file's directory — it cannot live
      # inside the ./portfolio-terminal build context it already duplicates.
      - seccomp:seccomp-profile.json
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    expose:
      - "8000"
    read_only: true       # Make the container filesystem read-only
    tmpfs:                # Mount temporary directories for write access
      - /tmp:exec,size=64M
      - /home/coder/sandboxes:exec,size=128M
      - /home/coder/projects:exec,size=128M
    volumes:
      - ./portfolio-terminal:/app
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - PORT=8000
      # F4-01: DB-driven demo whitelist — the terminal service syncs has_demo
      # slugs from this API base (contract §6 feed). This legacy compose talks
      # to its own backend container on :8080; prod (DO App Platform) sets
      # https://api.aouichou.me instead (deploy step, not code).
      - API_BASE_URL=http://backend:8080
      # Must match the backend's TERMINAL_PROXY_SECRET; unset + DEBUG off
      # = terminal rejects every WS connection (fail closed)
      - TERMINAL_PROXY_SECRET=${TERMINAL_PROXY_SECRET:-}
      # F4-02: slug-bound guest tokens — same shared-secret posture: must
      # equal the backend's SECRET_KEY (set in root .env or shell; unset +
      # DEBUG off = terminal rejects every WS connection, fail closed)
      - TERMINAL_JWT_SECRET=${SECRET_KEY:-}
    depends_on: [redis]

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: portfolio_api/.env
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped

  # waf:
  #   image: owasp/modsecurity-crs:3.3
  #   volumes:
  #     - ./modsec/rules:/etc/modsecurity.d/rules

  # elk:
  #   image: sebp/elk:8.11
  #   ports: ["5601:5601", "9200:9200", "5044:5044"]

  # monitoring:
  #   image: prom/prometheus
  #   ports: ["9090:9090"]
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml

networks:
  app-network:
    driver: bridge

volumes:
  media_volume:
    driver: local
  postgres_data:
    driver: local